# Prometheus Configuration for VModulith Runtime

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vmodu
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "vmodu_rules.yml"

scrape_configs:
  # ═════════════════════════════════════════════════════════════
  # VModulith API Metrics
  # ═════════════════════════════════════════════════════════════
  - job_name: 'vmodu-api'
    static_configs:
      - targets: 
        - 'vmodu-api:9090'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # ═════════════════════════════════════════════════════════════
  # PostgreSQL Metrics (if using postgres_exporter)
  # ═════════════════════════════════════════════════════════════
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # ═════════════════════════════════════════════════════════════
  # Redis Metrics (if using redis_exporter)
  # ═════════════════════════════════════════════════════════════
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # ═════════════════════════════════════════════════════════════
  # Node Exporter (if running)
  # ═════════════════════════════════════════════════════════════
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
