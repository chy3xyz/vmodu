# ═══════════════════════════════════════════════════════════════
# VModu Runtime - Production Docker Compose
# Usage: docker-compose -f deploy/docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ═════════════════════════════════════════════════════════════
  # VModu API Load Balancer (Nginx)
  # ═════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: vmodu-nginx
    hostname: nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx

    networks:
      - vmodu_frontend
      - vmodu_backend

    depends_on:
      - vmodu-api-1
      - vmodu-api-2
      - vmodu-api-3

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════
  # VModu API Instances (3 replicas)
  # ═════════════════════════════════════════════════════════════
  vmodu-api-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    container_name: vmodu-api-1
    hostname: vmodu-api-1
    restart: always

    environment:
      - VMODU_ENV=production
      - VMODU_LOG_LEVEL=warn
      - VMODU_HTTP_PORT=8080
      - VMODU_NODE_ID=node-1
      - VMODU_CLUSTER_SEEDS=vmodu-api-2:9000,vmodu-api-3:9000
      - VMODU_DB_HOST=postgres-primary
      - VMODU_DB_PORT=5432
      - VMODU_DB_NAME=vmodu
      - VMODU_DB_USER=vmodu
      - VMODU_DB_PASSWORD=${DB_PASSWORD}
      - VMODU_REDIS_HOST=redis-sentinel
      - VMODU_REDIS_PORT=26379
      - VMODU_REDIS_PASSWORD=${REDIS_PASSWORD}
      - VMODU_JWT_SECRET=${JWT_SECRET}
      - VMODU_ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - vmodu_data_1:/data/vmodu

    networks:
      - vmodu_backend
      - vmodu_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "vmodu-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vmodu-api-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    container_name: vmodu-api-2
    hostname: vmodu-api-2
    restart: always

    environment:
      - VMODU_ENV=production
      - VMODU_LOG_LEVEL=warn
      - VMODU_HTTP_PORT=8080
      - VMODU_NODE_ID=node-2
      - VMODU_CLUSTER_SEEDS=vmodu-api-1:9000,vmodu-api-3:9000
      - VMODU_DB_HOST=postgres-primary
      - VMODU_DB_PORT=5432
      - VMODU_DB_NAME=vmodu
      - VMODU_DB_USER=vmodu
      - VMODU_DB_PASSWORD=${DB_PASSWORD}
      - VMODU_REDIS_HOST=redis-sentinel
      - VMODU_REDIS_PORT=26379
      - VMODU_REDIS_PASSWORD=${REDIS_PASSWORD}
      - VMODU_JWT_SECRET=${JWT_SECRET}
      - VMODU_ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - vmodu_data_2:/data/vmodu

    networks:
      - vmodu_backend
      - vmodu_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "vmodu-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vmodu-api-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    container_name: vmodu-api-3
    hostname: vmodu-api-3
    restart: always

    environment:
      - VMODU_ENV=production
      - VMODU_LOG_LEVEL=warn
      - VMODU_HTTP_PORT=8080
      - VMODU_NODE_ID=node-3
      - VMODU_CLUSTER_SEEDS=vmodu-api-1:9000,vmodu-api-2:9000
      - VMODU_DB_HOST=postgres-primary
      - VMODU_DB_PORT=5432
      - VMODU_DB_NAME=vmodu
      - VMODU_DB_USER=vmodu
      - VMODU_DB_PASSWORD=${DB_PASSWORD}
      - VMODU_REDIS_HOST=redis-sentinel
      - VMODU_REDIS_PORT=26379
      - VMODU_REDIS_PASSWORD=${REDIS_PASSWORD}
      - VMODU_JWT_SECRET=${JWT_SECRET}
      - VMODU_ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - vmodu_data_3:/data/vmodu

    networks:
      - vmodu_backend
      - vmodu_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "vmodu-cli", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═════════════════════════════════════════════════════════════
  # PostgreSQL Primary (Master)
  # ═════════════════════════════════════════════════════════════
  postgres-primary:
    image: postgres:16-alpine
    container_name: vmodu-postgres-primary
    hostname: postgres-primary
    restart: always

    environment:
      - POSTGRES_DB=vmodu
      - POSTGRES_USER=vmodu
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/postgres-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    networks:
      - vmodu_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmodu -d vmodu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════
  # PostgreSQL Replica (Read-only)
  # ═════════════════════════════════════════════════════════════
  postgres-replica:
    image: postgres:16-alpine
    container_name: vmodu-postgres-replica
    hostname: postgres-replica
    restart: always

    environment:
      - POSTGRES_DB=vmodu
      - POSTGRES_USER=vmodu
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres-replica.conf:/etc/postgresql/postgresql.conf:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    networks:
      - vmodu_internal

    depends_on:
      - postgres-primary

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ═════════════════════════════════════════════════════════════
  # Redis Sentinel (HA)
  # ═════════════════════════════════════════════════════════════
  redis-master:
    image: redis:7-alpine
    container_name: vmodu-redis-master
    hostname: redis-master
    restart: always

    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_master_data:/data

    networks:
      - vmodu_internal

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis-replica:
    image: redis:7-alpine
    container_name: vmodu-redis-replica
    hostname: redis-replica
    restart: always

    command: >
      redis-server
      --replicaof redis-master 6379
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}

    networks:
      - vmodu_internal

    depends_on:
      - redis-master

  redis-sentinel:
    image: redis:7-alpine
    container_name: vmodu-redis-sentinel
    hostname: redis-sentinel
    restart: always

    command: >
      redis-sentinel
      /etc/redis/sentinel.conf
      --sentinel

    volumes:
      - ./config/redis-sentinel.conf:/etc/redis/sentinel.conf:ro

    networks:
      - vmodu_internal
      - vmodu_backend

    depends_on:
      - redis-master
      - redis-replica

  # ═════════════════════════════════════════════════════════════
  # RabbitMQ Message Queue
  # ═════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vmodu-rabbitmq
    hostname: rabbitmq
    restart: always

    environment:
      - RABBITMQ_DEFAULT_USER=vmodu
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - vmodu_internal

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ═════════════════════════════════════════════════════════════
  # Elasticsearch (Search)
  # ═════════════════════════════════════════════════════════════
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: vmodu-elasticsearch
    hostname: elasticsearch
    restart: always

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - vmodu_internal

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ═════════════════════════════════════════════════════════════
  # MinIO Object Storage
  # ═════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: vmodu-minio
    hostname: minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      - MINIO_ROOT_USER=vmodu
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}

    volumes:
      - minio_data:/data

    networks:
      - vmodu_internal
      - vmodu_backend

# ═══════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════
networks:
  vmodu_frontend:
    driver: bridge
    internal: false
  vmodu_backend:
    driver: bridge
    internal: false
  vmodu_internal:
    driver: bridge
    internal: true

# ═══════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  vmodu_data_1:
  vmodu_data_2:
  vmodu_data_3:
  postgres_primary_data:
  postgres_replica_data:
  redis_master_data:
  rabbitmq_data:
  elasticsearch_data:
  minio_data:
  nginx_cache:
