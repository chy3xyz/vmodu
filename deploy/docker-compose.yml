# ═══════════════════════════════════════════════════════════════
# VModu Runtime - Development Docker Compose
# Usage: docker-compose -f deploy/docker-compose.yml up
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ═════════════════════════════════════════════════════════════
  # VModu Runtime API Server
  # ═════════════════════════════════════════════════════════════
  vmodu-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: development
    container_name: vmodu-api
    hostname: vmodu-api
    restart: unless-stopped

    ports:
      - "8080:8080" # HTTP API
      - "9000:9000" # gRPC
      - "9090:9090" # Metrics

    environment:
      - VMODU_ENV=development
      - VMODU_LOG_LEVEL=debug
      - VMODU_HTTP_PORT=8080
      - VMODU_GRPC_PORT=9000
      - VMODU_METRICS_PORT=9090
      - VMODU_DB_HOST=postgres
      - VMODU_DB_PORT=5432
      - VMODU_DB_NAME=vmodu
      - VMODU_DB_USER=vmodu
      - VMODU_DB_PASSWORD=vmodu_dev
      - VMODU_REDIS_HOST=redis
      - VMODU_REDIS_PORT=6379
      - VMODU_REDIS_PASSWORD=
      - VMODU_JWT_SECRET=dev_secret_key_change_in_production

    volumes:
      - ../:/app # Mount source for hot reload
      - vmodu_data:/data/vmodu # Persistent data

    networks:
      - vmodu_network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Override default command to run specific file
    command: ["v", "-enable-globals", "run", "main.v"]

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: vmodu-postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=vmodu
      - POSTGRES_USER=vmodu
      - POSTGRES_PASSWORD=vmodu_dev
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - vmodu_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmodu -d vmodu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═════════════════════════════════════════════════════════════
  # Redis Cache
  # ═════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: vmodu-redis
    hostname: redis
    restart: unless-stopped

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - vmodu_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═════════════════════════════════════════════════════════════
  # Prometheus Metrics
  # ═════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: vmodu-prometheus
    hostname: prometheus
    restart: unless-stopped

    ports:
      - "9091:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

    networks:
      - vmodu_network

  # ═════════════════════════════════════════════════════════════
  # Grafana Dashboard
  # ═════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.3.0
    container_name: vmodu-grafana
    hostname: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    networks:
      - vmodu_network

    depends_on:
      - prometheus

# ═══════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════
networks:
  vmodu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ═══════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  vmodu_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
